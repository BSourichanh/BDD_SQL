services:
  php:
    container_name: docker_php
    build: .docker/php
    volumes:
      - .:/home/wwwroot
    ports:
      - '8000:8000'
    command: php -S 0.0.0.0:8000 -t /home/wwwroot/04_Iteration_4_Passage_a_l_Echelle/formulaire_recherche_sirene

  db:
    build: .docker/db
    command: [ '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci','--default-authentication-plugin=mysql_native_password' ]
    container_name: docker_mysql
    restart: always
    ports:
      - '6603:3306'

  spark-dashboard:
    container_name: docker_spark_dashboard
    image: python:3.12-slim
    volumes:
      - .:/home/wwwroot
    ports:
      - '8090:8090'
    working_dir: /home/wwwroot
    command: python3 05_Iteration_5_SQL_Analytique_et_Spark/SOURICHANH-Bernard-Campus-Atelier2-DashboardSpark.py
